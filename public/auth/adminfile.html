<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Anonymous Student Feedback System</title>
<link rel="stylesheet" href="/css/hod-login.css">
</head>
<body>
<header>
  <div class="header-content">
    <div>
      <h1>Anonymous Student Feedback System</h1>
      <p>Administrator Login Portal</p>
    </div>
    <button id="dark-mode-btn" type="button">🌙 Dark Mode</button>
  </div>
</header>
<main>
  <section class="login-box">
    <h2>⚙️ Admin Secure Login</h2>
    <div id="login-error"></div>
    <form action="/admin/login" method="POST">
      <label for="adminid">Admin ID</label>
      <input type="text" id="adminid" name="adminid" placeholder="Enter Admin ID" autocomplete="username" required>
      <label for="password">Password</label>
      <div class="password-box">
        <input type="password" id="password" name="password" placeholder="Enter Password" autocomplete="current-password" required>
        <span class="eye-icon" id="password-toggle" role="button" tabindex="0" aria-label="Show password">👁</span>
      </div>
      <div class="button-group">
        <button type="submit">Secure Login</button>
        <button type="reset">Clear</button>
      </div>
    </form>
    <div class="security-notice">
      <strong>✓ Authorized Personnel Only</strong>
      <p>This portal is restricted to system administrators.</p>
    </div>
    <div class="links">
      <a href="/">← Back to Portal</a>
    </div>
  </section>
</main>
<footer><p>© 2026 Anonymous Student Feedback System</p></footer>
<script src="/js/darkmode.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const toggle = document.getElementById('password-toggle');
  const pwd = document.getElementById('password');
  if (toggle && pwd) {
    function tp() {
      if (pwd.type === 'password') { pwd.type = 'text'; toggle.textContent = '🙈'; toggle.setAttribute('aria-label','Hide password'); }
      else { pwd.type = 'password'; toggle.textContent = '👁'; toggle.setAttribute('aria-label','Show password'); }
    }
    toggle.addEventListener('click', tp);
    toggle.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); tp(); } });
  }
  const params = new URLSearchParams(window.location.search);
  const error = params.get('error');
  const box = document.getElementById('login-error');
  if (error && box) { box.className = 'error-box'; box.textContent = error; box.style.display = 'block'; }
  if (window.history.replaceState) window.history.replaceState({}, document.title, window.location.pathname);
});
</script>
</body>
</html>
