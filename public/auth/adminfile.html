<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Anonymous Student Feedback System</title>

    <link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="/css/darkmode.css">`n</head>
<body>

    <header>

<button id="dark-mode-btn">
?? Dark Mode
</button>

        <h1>Anonymous Student Feedback System</h1>
        <p>Administrator Login Portal</p>
    </header>

    <main>

        <section class="login-box">

            <h2>Admin Login</h2>

            <form action="#" method="post">

                <label for="adminid">Admin ID</label>
                <input
                    type="text"
                    id="adminid"
                    name="adminid"
                    placeholder="Enter Admin ID"
                    required
                >

                <label for="email">Admin Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter Admin Email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >

                <div class="checkbox">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember Me</label>
                </div>

                <div class="button-group">
                    <button type="submit">Login</button>
                    <button type="reset">Clear</button>
                </div>

            </form>

            <div class="links">
                <a href="#">Forgot Password?</a>

                <br><br>

                <a href="index.html">← Back to Home</a>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Anonymous Student Feedback System. All Rights Reserved.</p>
    </footer>

<script src="/js/darkmode.js"></script>`n</body>
</html>
