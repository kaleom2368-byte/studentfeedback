<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Faculty Directory | Anonymous Student Feedback System</title>

    <link
        rel="stylesheet"
        href="/css/faculty-directory.css"
    >

    <link
        rel="stylesheet"
        href="/css/darkmode.css"
    >
</head>


<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="directory-header">

        <div class="header-inner">

            <div class="header-title">

                <div class="header-icon">
                    👨‍🏫
                </div>

                <div>
                    <h1>Faculty Directory</h1>

                    <p>
                        Browse faculty members and submit anonymous feedback.
                    </p>
                </div>

            </div>


            <div style="display:flex;gap:0.5rem;align-items:center;">
                <button id="dark-mode-btn" type="button" style="padding:0.5rem 1rem;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text-main);cursor:pointer;font-size:0.85rem;font-weight:600;">🌙 Dark Mode</button>
                <a
                    href="/dashboard/student-dashboard.html"
                    class="back-button"
                >
                    ← Back to Dashboard
                </a>
            </div>

        </div>

    </header>



    <!-- ================================
         MAIN
    ================================= -->

    <main class="directory-main">

        <!-- Department heading -->

        <section class="department-section">

            <div>

                <span class="section-label">
                    FACULTY DIRECTORY
                </span>

                <h2 id="department-name">
                    Loading Department...
                </h2>

                <p>
                    Select a faculty member below to continue.
                </p>

            </div>

        </section>



        <!-- Search -->

        <section class="search-section">

            <div class="search-box">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="text"
                    id="faculty-search"
                    placeholder="Search faculty by name or subject..."
                    autocomplete="off"
                >

            </div>

        </section>



        <!-- Faculty -->

        <section
            id="faculty-container"
            class="faculty-grid"
        >

            <div class="loading-card">

                <div class="loading-spinner"></div>

                <p>
                    Loading faculty members...
                </p>

            </div>

        </section>

    </main>



    <!-- ================================
         FOOTER
    ================================= -->

    <footer class="directory-footer">

        <p>
            Anonymous Student Feedback System
        </p>

    </footer>



    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script src="/js/faculty-directory.js?v=2"></script>

    <script src="/js/darkmode.js?v=2"></script>

</body>

</html>
