<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOD Login | Anonymous Student Feedback System</title>

    <link rel="stylesheet" href="./css/hod.css">
</head>
<body>

    <header>
        <h1>Anonymous Student Feedback System</h1>
        <p>Head of Department Login Portal</p>
        
    </header>
        
    <main>
        <br>

        <section class="login-box">

            <h2>HOD Login</h2>

            <form action="#" method="post">

                <label for="hodid">HOD ID</label><br>
                <input
                    type="text"
                    id="hodid"
                    name="hodid"
                    placeholder="Enter HOD ID"
                    required
                ><br><br>

                <label for="email">College Email</label><br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter College Email"
                    required
                ><br><br>

                <label for="password">Password</label><br>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                ><br><br>

               <div class="checkbox">
    <input type="checkbox" id="remember">
    <label for="remember">Remember Me</label>
</div>

<div class="button-group">
    <button type="submit">Login</button>
    <button type="reset">Clear</button>
</div>

            <br>

             <div class="links">
                <a href="#">Forgot Password?</a>
                <br><br>
                <a href="index.html">← Back to Home</a>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Anonymous Student Feedback System</p>
    </footer>

</body>
</html>
