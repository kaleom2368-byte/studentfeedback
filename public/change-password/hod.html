<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password | HOD</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a8a, #0f172a); font-family: 'Segoe UI', sans-serif; }
.card { background: #fff; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.icon { font-size: 2.5rem; text-align: center; margin-bottom: 0.5rem; }
h2 { text-align: center; font-size: 1.4rem; color: #1f2937; margin-bottom: 0.3rem; }
.subtitle { text-align: center; color: #6b7280; font-size: 0.88rem; margin-bottom: 1.5rem; }
.error-box { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; border-radius: 8px; padding: 0.75rem; font-size: 0.85rem; margin-bottom: 1rem; }
label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 0.3rem; }
input[type=password] { width: 100%; padding: 0.7rem 1rem; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; margin-bottom: 1rem; transition: border-color 0.2s; }
input[type=password]:focus { outline: none; border-color: #3b82f6; }
button[type=submit] { width: 100%; padding: 0.8rem; background: linear-gradient(135deg, #1e3a8a, #0f172a); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 0.5rem; }
button[type=submit]:hover { opacity: 0.9; }
.note { font-size: 0.78rem; color: #9ca3af; text-align: center; margin-top: 1rem; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h2>Set Your New Password</h2>
  <p class="subtitle">Welcome, HOD! Please set a new password before continuing.</p>
  <div id="error-box" class="error-box" style="display:none"></div>
  <form action="/hod/change-password" method="POST">
    <label for="newPassword">New Password</label>
    <input type="password" id="newPassword" name="newPassword" placeholder="At least 6 characters" minlength="6" required>
    <label for="confirmPassword">Confirm Password</label>
    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" minlength="6" required>
    <button type="submit">Set Password →</button>
  </form>
  <p class="note">🔒 Your password is stored securely and never shown to anyone.</p>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const error = params.get('error');
  const box = document.getElementById('error-box');
  if (error && box) { box.textContent = error; box.style.display = 'block'; }
});
</script>
</body>
</html>
