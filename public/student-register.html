<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Signup | Anonymous Student Feedback System</title>

    <link rel="stylesheet" href="./css/student.css">

</head>


<body>


<header>

    <h1>Anonymous Student Feedback System</h1>
    <p>Create Student Profile</p>

</header>



<main>


<section class="login-box">


<h2>Student Sign Up</h2>



<form action="/student/register" method="post">



<label for="student_id">
Student ID
</label>

<input
type="text"
id="student_id"
name="student_id"
placeholder="Enter Student ID"
required
>



<label for="name">
Full Name
</label>

<input
type="text"
id="name"
name="name"
placeholder="Enter Full Name"
required
>



<label for="email">
College Email
</label>

<input
type="email"
id="email"
name="email"
placeholder="Enter Email"
required
>



<label for="password">
Password
</label>

<input
type="password"
id="password"
name="password"
placeholder="Create Password"
required
>



<label for="department">
Department
</label>

<select id="department" name="department" required>

<option value="">
Select Department
</option>

<option>
Computer Engineering
</option>

<option>
Information Technology
</option>

<option>
Mechanical Engineering
</option>

<option>
Civil Engineering
</option>

<option>
Electrical Engineering
</option>

<option>
Electronics Engineering
</option>

</select>



<label for="year">
Year
</label>

<select id="year" name="year" required>

<option value="">
Select Year
</option>

<option value="1">
First Year
</option>

<option value="2">
Second Year
</option>

<option value="3">
Third Year
</option>

<option value="4">
Final Year
</option>

</select>



<label for="division">
Division
</label>

<input
type="text"
id="division"
name="division"
placeholder="Enter Division"
required
>



<div class="button-group">

<button type="submit">
Create Account
</button>


<button type="reset">
Clear
</button>


</div>



</form>



<div class="links">

<p>
Already have an account?
</p>

<a href="student.html">
Login Here
</a>


<br><br>


<a href="mainfile.html">
← Back to Home
</a>


</div>



</section>


</main>



<footer>

<p>
&copy; 2026 Anonymous Student Feedback System
</p>

</footer>



</body>

</html>
