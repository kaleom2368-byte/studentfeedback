<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Faculty Login | Anonymous Student Feedback System
    </title>


    <link rel="stylesheet" href="./css/faculty.css">

</head>


<body>


<header>

    <h1>
        Anonymous Student Feedback System
    </h1>

    <p>
        Faculty Login Portal
    </p>

</header>




<main>


<section class="login-box">


    <h2>
        👨‍🏫 Faculty Login
    </h2>




    <form action="/faculty/login" method="POST">



        <label for="facultyid">
            Faculty ID
        </label>


        <input

            type="text"

            id="facultyid"

            name="faculty_id"

            placeholder="Enter Faculty ID"

            required

        >






        <label for="email">
            College Email
        </label>


        <input

            type="email"

            id="email"

            name="email"

            placeholder="Enter College Email"

            required

        >






        <label for="department">
            Department
        </label>


        <select

            id="department"

            name="department"

            required

        >


            <option value="">
                Select Department
            </option>


            <option>
                Computer Engineering
            </option>


            <option>
                Information Technology
            </option>


            <option>
                Mechanical Engineering
            </option>


            <option>
                Civil Engineering
            </option>


            <option>
                Electrical Engineering
            </option>


            <option>
                Electronics Engineering
            </option>


        </select>






        <label for="password">
            Password
        </label>


        <input

            type="password"

            id="password"

            name="password"

            placeholder="Enter Password"

            required

        >





        <div class="checkbox">


            <input

                type="checkbox"

                id="remember"

            >


            <label for="remember">
                Remember Me
            </label>


        </div>






        <div class="button-group">


            <button type="submit">

                Login

            </button>



            <button type="reset">

                Clear

            </button>


        </div>



    </form>






    <div class="links">


        <a href="#">
            Forgot Password?
        </a>


        <br><br>


        <a href="index.html">
            ← Back to Home
        </a>



    </div>




</section>


</main>






<footer>


    <p>
        © 2026 Anonymous Student Feedback System
    </p>


</footer>




</body>

</html>
